<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 96" role="img" aria-label="Besago Ventures">
  <!-- Besago Ventures wordmark: gold B monogram + serif BESAGO + spaced VENTURES -->
  <rect x="4" y="20" width="64" height="64" rx="16" fill="#0B1B33" stroke="#C9A24B" stroke-width="2.5"/>
  <text x="36" y="65" text-anchor="middle" font-family="Fraunces, Georgia, serif" font-weight="600" font-size="38" fill="#C9A24B">B</text>
  <text x="86" y="54" font-family="Fraunces, Georgia, serif" font-weight="600" font-size="34" letter-spacing="2" fill="#0B1B33">BESAGO</text>
  <text x="88" y="76" font-family="Inter, Arial, sans-serif" font-weight="600" font-size="12" letter-spacing="9.5" fill="#8A6A24">VENTURES</text>
</svg>
